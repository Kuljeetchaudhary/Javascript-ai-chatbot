<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chatbot-popup">
      <!-- ..... chatbot Header.... -->

      <div class="chatbot-header">
        <div class="header-info">
          <svg
            class="avatar"
            xmlns="http://www.w3.org/2000/svg"
            width="70"
            height="70"
            viewBox="0 0 100 100"
          >
            <defs>
              <!-- Main 3D gradient -->
              <linearGradient id="botHead" x1="15" y1="10" x2="85" y2="90">
                <stop offset="0%" stop-color="#8B5CF6" />
                <stop offset="45%" stop-color="#6366F1" />
                <stop offset="100%" stop-color="#312E81" />
              </linearGradient>

              <!-- Face gradient -->
              <linearGradient id="face" x1="20" y1="20" x2="80" y2="80">
                <stop offset="0%" stop-color="#F5F3FF" />
                <stop offset="100%" stop-color="#C7D2FE" />
              </linearGradient>

              <!-- Eye gradient -->
              <radialGradient id="eye">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="45%" stop-color="#67E8F9" />
                <stop offset="100%" stop-color="#06B6D4" />
              </radialGradient>

              <!-- Shadow -->
              <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow
                  dx="0"
                  dy="5"
                  stdDeviation="4"
                  flood-opacity="0.35"
                />
              </filter>
            </defs>

            <!-- Antenna -->
            <path
              d="M47 15V8"
              stroke="#6366F1"
              stroke-width="5"
              stroke-linecap="round"
            />

            <!-- Antenna light -->
            <circle cx="47" cy="6" r="5" fill="#22C55E" />

            <!-- Left ear -->
            <rect x="5" y="38" width="10" height="24" rx="5" fill="#4F46E5" />

            <!-- Right ear -->
            <rect x="79" y="38" width="10" height="24" rx="5" fill="#4F46E5" />

            <!-- Main head -->
            <rect
              x="12"
              y="18"
              width="70"
              height="68"
              rx="22"
              fill="url(#botHead)"
              filter="url(#shadow)"
            />

            <!-- 3D highlight -->
            <path
              d="M22 30C27 23 34 21 43 21H66"
              fill="none"
              stroke="#C4B5FD"
              stroke-width="4"
              stroke-linecap="round"
              opacity="0.65"
            />

            <!-- Face -->
            <rect
              x="20"
              y="33"
              width="54"
              height="40"
              rx="15"
              fill="url(#face)"
            />

            <!-- Left eye -->
            <circle cx="35" cy="49" r="7" fill="url(#eye)" />

            <!-- Right eye -->
            <circle cx="59" cy="49" r="7" fill="url(#eye)" />

            <!-- Eye highlights -->
            <circle cx="33" cy="47" r="2" fill="white" />
            <circle cx="57" cy="47" r="2" fill="white" />

            <!-- Smile -->
            <path
              d="M34 60C39 66 55 66 60 60"
              fill="none"
              stroke="#4F46E5"
              stroke-width="3.5"
              stroke-linecap="round"
            />

            <!-- Bottom 3D section -->
            <path
              d="M30 78H54C51 84 47 88 42 88C37 88 33 84 30 78Z"
              fill="#3730A3"
              opacity="0.9"
            />

            <!-- Ear lights -->
            <circle cx="10" cy="50" r="2.5" fill="#22D3EE" />
            <circle cx="84" cy="50" r="2.5" fill="#22D3EE" />
          </svg>

          <h2 class="logo-text">Chatbot</h2>
        </div>
        <button id="close-chatbot" class="material-symbols-rounded">
          keyboard_arrow_down
        </button>
      </div>

      <!-- ..... chatbot body .... -->
      <div class="chatbot-body">
        <div class="message bot-message">
          <svg
            class="bot-avatar"
            xmlns="http://www.w3.org/2000/svg"
            width="70"
            height="70"
            viewBox="0 0 100 100"
          >
            <defs>
              <!-- Main 3D gradient -->
              <linearGradient id="botHead" x1="15" y1="10" x2="85" y2="90">
                <stop offset="0%" stop-color="#8B5CF6" />
                <stop offset="45%" stop-color="#6366F1" />
                <stop offset="100%" stop-color="#312E81" />
              </linearGradient>

              <!-- Face gradient -->
              <linearGradient id="face" x1="20" y1="20" x2="80" y2="80">
                <stop offset="0%" stop-color="#F5F3FF" />
                <stop offset="100%" stop-color="#C7D2FE" />
              </linearGradient>

              <!-- Eye gradient -->
              <radialGradient id="eye">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="45%" stop-color="#67E8F9" />
                <stop offset="100%" stop-color="#06B6D4" />
              </radialGradient>

              <!-- Shadow -->
              <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow
                  dx="0"
                  dy="5"
                  stdDeviation="4"
                  flood-opacity="0.35"
                />
              </filter>
            </defs>

            <!-- Antenna -->
            <path
              d="M47 15V8"
              stroke="#6366F1"
              stroke-width="5"
              stroke-linecap="round"
            />

            <!-- Antenna light -->
            <circle cx="47" cy="6" r="5" fill="#22C55E" />

            <!-- Left ear -->
            <rect x="5" y="38" width="10" height="24" rx="5" fill="#4F46E5" />

            <!-- Right ear -->
            <rect x="79" y="38" width="10" height="24" rx="5" fill="#4F46E5" />

            <!-- Main head -->
            <rect
              x="12"
              y="18"
              width="70"
              height="68"
              rx="22"
              fill="url(#botHead)"
              filter="url(#shadow)"
            />

            <!-- 3D highlight -->
            <path
              d="M22 30C27 23 34 21 43 21H66"
              fill="none"
              stroke="#C4B5FD"
              stroke-width="4"
              stroke-linecap="round"
              opacity="0.65"
            />

            <!-- Face -->
            <rect
              x="20"
              y="33"
              width="54"
              height="40"
              rx="15"
              fill="url(#face)"
            />

            <!-- Left eye -->
            <circle cx="35" cy="49" r="7" fill="url(#eye)" />

            <!-- Right eye -->
            <circle cx="59" cy="49" r="7" fill="url(#eye)" />

            <!-- Eye highlights -->
            <circle cx="33" cy="47" r="2" fill="white" />
            <circle cx="57" cy="47" r="2" fill="white" />

            <!-- Smile -->
            <path
              d="M34 60C39 66 55 66 60 60"
              fill="none"
              stroke="#4F46E5"
              stroke-width="3.5"
              stroke-linecap="round"
            />

            <!-- Bottom 3D section -->
            <path
              d="M30 78H54C51 84 47 88 42 88C37 88 33 84 30 78Z"
              fill="#3730A3"
              opacity="0.9"
            />

            <!-- Ear lights -->
            <circle cx="10" cy="50" r="2.5" fill="#22D3EE" />
            <circle cx="84" cy="50" r="2.5" fill="#22D3EE" />
          </svg>
          <div class="message-text">Hey There<br />How can i help you !</div>
        </div>
      </div>

      <!-- ..... chatbot footer .... -->

      <div class="chatbot-footer">
        <form action="#" class="chatbot-form">
          <textarea
            class="message-input"
            placeholder="Message...."
            required
          ></textarea>
          <div class="chatbot-controls">
            <button
            
              type="button"
              id="close-chatbot emoji-picker"
              class="material-symbols-rounded"
            >
              sentiment_satisfied
            </button>
            <div class="file upload-wrapper">
               <input type="file" accept="images/*" id="file-input" hidden>
                <button id="file-upload"
              type="button"
              id="close-chatbot"
              class="material-symbols-rounded"
            >
              attach_file
            </button>
            </div>
          
            <button
              id="send-message"
              type="submit"
              id="close-chatbot "
              class="material-symbols-rounded"
            >
              arrow_upward
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
    <script src="script.js"></script>
  </body>
</html>
